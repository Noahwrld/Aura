<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><text y=%220.9em%22 font-size=%2290%22>🌿</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Wellness & Spa | Premium Sanctuary & Netlify Booking System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#faf8f5] text-[#2c2925] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden Netlify Form for HTML Parser detection -->
    <!-- This ensures Netlify detects the form during build time, enabling Email notifications & Form Submissions -->
    <form name="bookings" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="bookings" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <input type="text" name="therapist" />
      <input type="text" name="date" />
      <input type="text" name="time" />
      <textarea name="special_requests"></textarea>
      <input type="text" name="promo_code" />
      <input type="checkbox" name="newsletter" />
    </form>
  </body>
</html>
